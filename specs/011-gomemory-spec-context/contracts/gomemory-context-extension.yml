# Contrato: extension.yml de la nueva extensión spec-kit "gomemory-context"
#
# Este archivo documenta el CONTRATO (forma e invariantes), no es
# necesariamente el extension.yml final byte-a-byte — /speckit-tasks e
# /speckit-implement lo materializan en
# .specify/extensions/gomemory-context/extension.yml siguiendo esta forma.
#
# Invariantes de este contrato (ver research.md #2 y #6):
#   - hooks.before_specify.optional DEBE ser `false` (mandatorio) — FR-001.
#   - El comando DEBE tolerar la ausencia del binario `mem`/MCP sin fallar
#     el flujo de /speckit-specify (FR-004) — el script termina en 0 sin
#     salida si no puede resolver contexto.
#   - Este archivo NO se registra a mano en .specify/extensions/.registry
#     ni en .specify/extensions.yml (ver research.md #6): la instalación
#     real corre vía la CLI `specify extension install`.

schema_version: "1.0"

extension:
  id: gomemory-context
  name: "gomemory Project History Context"
  version: "1.0.0"
  description: "Inyecta un resumen del historial del proyecto (memorias, decisiones, y grafo de código externo cuando está disponible) desde gomemory antes de crear o continuar una especificación"
  author: gomemory
  repository: local
  license: MIT

requires:
  speckit_version: ">=0.2.0"

provides:
  commands:
    - name: speckit.gomemory-context.update
      file: commands/speckit.gomemory-context.update.md
      description: "Obtiene el resumen de historial de gomemory (mem context) y lo incorpora al contexto de la especificación"

hooks:
  before_specify:
    command: speckit.gomemory-context.update
    optional: false          # MANDATORIO — ver research.md #2 (FR-001)
    description: "Incorpora automáticamente el historial del proyecto antes de redactar una especificación nueva"
  before_plan:
    command: speckit.gomemory-context.update
    optional: true           # extensión de Historia 3 (P3) — opcional, no MVP
    description: "Incorpora el historial del proyecto al planificar, si la sesión no lo cargó ya en /speckit-specify"
  before_clarify:
    command: speckit.gomemory-context.update
    optional: true           # extensión de Historia 3 (P3) — opcional, no MVP
    description: "Incorpora el historial del proyecto al aclarar, si la sesión no lo cargó ya en /speckit-specify"

tags:
  - "context"
  - "memory"
  - "gomemory"
