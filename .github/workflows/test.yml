name: test

# Validación de cambios (spec 037, FR-025/FR-027). release.yml solo corre con
# tags y no ejecutaba la suite: este workflow la ejecuta en cada push y pull
# request, sin omitir pruebas ni rebajar umbrales para aprobar.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: núcleo Go, cobertura y runner (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: Detector de carreras en las rutas afectadas
        run: go test -race ./application/usecases ./adapters/secondary/persistence ./adapters/primary/cli -count=1

      - name: Cobertura combinada (umbral 80 %)
        run: |
          GOMEMORY_COVERAGE_OUTPUT="$RUNNER_TEMP/coverage" bash scripts/coverage.sh

  plugin-installer:
    name: plugin OpenCode e instalador TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Mínimo declarado por installer/package.json (engines: >=22.20.0).
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.20.0"

      - name: Plugin OpenCode (suite completa)
        run: node --test infrastructure/plugin/opencode/gomemory.test.mjs

      - name: Instalador
        run: |
          npm --prefix installer ci
          npm --prefix installer run typecheck
          npm --prefix installer test

  windows:
    name: Windows (Go y install.ps1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: go test
        run: go test ./... -count=1

      - name: Instalador PowerShell (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'audit037-ps51'
          go build -o (Join-Path $env:RUNNER_TEMP 'mem.exe') ./infrastructure
          powershell -NoProfile -File scripts/audit_037_windows_smoke.ps1 -MemBin (Join-Path $env:RUNNER_TEMP 'mem.exe') -WorkDir $work -Case all
          exit $LASTEXITCODE

      - name: Instalador PowerShell (PowerShell 7)
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'audit037-ps7'
          pwsh -NoProfile -File scripts/audit_037_windows_smoke.ps1 -MemBin (Join-Path $env:RUNNER_TEMP 'mem.exe') -WorkDir $work -Case all
          exit $LASTEXITCODE

      - name: Evidencia de Windows
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: audit037-windows
          path: |
            ${{ runner.temp }}/audit037-ps51/result.json
            ${{ runner.temp }}/audit037-ps7/result.json
          if-no-files-found: warn
