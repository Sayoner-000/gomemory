name: test

# Validación de cambios (spec 037, FR-025/FR-027). release.yml solo corre con
# tags y no ejecutaba la suite: este workflow la ejecuta en cada push y pull
# request, sin omitir pruebas ni rebajar umbrales para aprobar.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: núcleo Go, cobertura y runner (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Archivos sin gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: install.sh contra el último release (ruta documentada)
        if: always()
        run: |
          bin="$RUNNER_TEMP/mem-release"
          GOMEMORY_BIN_DIR="$bin" bash scripts/install.sh </dev/null
          "$bin/mem" version

      - name: Detector de carreras en las rutas afectadas
        run: go test -race ./application/usecases ./adapters/secondary/persistence ./adapters/primary/cli -count=1

      - name: Cobertura combinada (umbral 80 %)
        run: |
          GOMEMORY_COVERAGE_OUTPUT="$RUNNER_TEMP/coverage" bash scripts/coverage.sh

  plugin-installer:
    name: plugin OpenCode e instalador TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Mínimo declarado por installer/package.json (engines: >=22.20.0).
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.20.0"

      - name: Plugin OpenCode (suite completa)
        run: node --test infrastructure/plugin/opencode/gomemory.test.mjs

      - name: Instalador
        run: |
          npm --prefix installer ci
          npm --prefix installer run typecheck
          npm --prefix installer test

  windows:
    name: Windows (Go y binario del release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: go test
        run: go test ./... -count=1

      - name: Binario del release por descarga manual (ruta documentada)
        if: always()
        shell: pwsh
        run: |
          # Certifica la instalación documentada en INSTALLATION.md contra el
          # último release publicado: descarga, SHA-256, extracción y arranque.
          $dir = Join-Path $env:RUNNER_TEMP 'mem-release'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $base = 'https://github.com/Sayoner-000/gomemory/releases/latest/download'
          Invoke-WebRequest "$base/mem_windows_amd64.zip" -OutFile "$dir\mem_windows_amd64.zip"
          Invoke-WebRequest "$base/checksums.txt" -OutFile "$dir\checksums.txt"
          $want = (Select-String -Path "$dir\checksums.txt" -Pattern ' mem_windows_amd64\.zip$').Line.Split(' ')[0]
          $got = (Get-FileHash "$dir\mem_windows_amd64.zip" -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { throw "SHA-256 distinto: $got frente a $want" }
          Expand-Archive "$dir\mem_windows_amd64.zip" -DestinationPath $dir -Force
          & "$dir\mem.exe" version
          if ($LASTEXITCODE -ne 0) { throw "mem.exe version terminó con $LASTEXITCODE" }
