name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verificar vulnerabilidades alcanzables
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: "1.27.2"
          go-package: ./...

  goreleaser:
    needs: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tras publicar, lleva el literal de version/version.go a la release "latest"
  # para que los `go build` locales no se anuncien con una versión vieja. Usa la
  # release latest (no el tag del push): un prerelease o un hotfix de una línea
  # anterior no hace retroceder la versión.
  sync-version:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rama por defecto
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Sincronizar version/version.go
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          scripts/sync_version.sh
          if git diff --quiet -- version/version.go; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(version): sincroniza version.go con ${GITHUB_REF_NAME}" -- version/version.go
          git push origin "HEAD:${DEFAULT_BRANCH}"
